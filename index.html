<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Comparison Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 15px;
      text-align: center;
    }

    th {
      background: #222;
      color: white;
    }

    audio {
      width: 220px;
    }
  </style>
</head>
<body>

<h1>DNS Audio Comparison 🎧</h1>

<table>

  <tr>
    <th>DNS</th>
    <th>Clean</th>
    <th>Noisy</th>
    <th>Enhanced</th>
  </tr>

  <!-- HIGH -->
  <tr>
    <td><strong>High</strong></td>

    <td>
      <audio controls>
        <source src="audio/high_clean.wav" type="audio/wav">
      </audio>
    </td>

    <td>
      <audio controls>
        <source src="audio/high_noisy.wav" type="audio/wav">
      </audio>
    </td>

    <td>
      <audio controls>
        <source src="audio/high_enhanced.wav" type="audio/wav">
      </audio>
    </td>
  </tr>

  <!-- MIDDLE -->
  <tr>
    <td><strong>Middle</strong></td>

    <td>
      <audio controls>
        <source src="audio/mid_clean.wav" type="audio/wav">
      </audio>
    </td>

    <td>
      <audio controls>
        <source src="audio/mid_noisy.wav" type="audio/wav">
      </audio>
    </td>

    <td>
      <audio controls>
        <source src="audio/mid_enhanced.wav" type="audio/wav">
      </audio>
    </td>
  </tr>

  <!-- LOW -->
  <tr>
    <td><strong>Low</strong></td>

    <td>
      <audio controls>
        <source src="audio/low_clean.wav" type="audio/wav">
      </audio>
    </td>

    <td>
      <audio controls>
        <source src="audio/low_noisy.wav" type="audio/wav">
      </audio>
    </td>

    <td>
      <audio controls>
        <source src="audio/low_enhanced.wav" type="audio/wav">
      </audio>
    </td>
  </tr>

</table>

</body>
</html>
